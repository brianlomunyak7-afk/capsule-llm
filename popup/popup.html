<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LLM Capsule</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>🟣 LLM Capsule</h1>

        <p class="tagline">
            Carry your conversation anywhere.
        </p>

        <div class="buttons">

            <button id="capsuleButton">
                Create Capsule
            </button>

            <button id="viewButton">
                View Saved Capsule
            </button>

            <button id="exportButton">
                Export Capsule
            </button>

            <button id="importButton">
                Import Capsule
            </button>

            <button id="continueButton">
                Continue Conversation
            </button>

            <button id="libraryButton">
                📦 Capsule Library
            </button>

        </div>

        <input
            type="file"
            id="importFile"
            accept=".json"
            hidden
        >

        <div
            class="status"
            id="status">
        </div>

        <pre id="capsuleOutput"></pre>

        <div
            id="library"
            class="library">
        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
