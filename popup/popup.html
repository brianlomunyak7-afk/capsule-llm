<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LLM Capsule</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="container">

    <!-- Header -->
    <header class="header">

        <div class="logo">
            🟣
        </div>

        <div>
            <h1>LLM Capsule</h1>
            <p>Carry your conversation anywhere.</p>
        </div>

    </header>


    <!-- Main actions -->
    <section class="main-actions">

        <button
            id="capsuleButton"
            class="generate-button">

            ✨ Generate Prompt

        </button>


        <button
            id="dropButton"
            class="drop-button">

            📥 Drop Prompt

        </button>

    </section>


    <!-- Hidden file input -->
    <input
        type="file"
        id="importFile"
        accept=".json,.llmcapsule,.txt"
        hidden
    >


    <!-- Status -->
    <div
        id="status"
        class="status">
    </div>


    <!-- Saved prompts -->
    <section class="saved-section">

        <div class="section-header">

            <h2>Saved Prompts</h2>

            <span
                id="libraryCount"
                class="library-count">
                0
            </span>

        </div>


        <div
            id="library"
            class="library">

        </div>

    </section>


    <!-- Prompt preview -->
    <section
        id="promptPreview"
        class="prompt-preview">

        <div class="preview-header">

            <h2 id="previewTitle">
                Prompt
            </h2>

            <button
                id="closePreview"
                class="close-button">
                ✕
            </button>

        </div>


        <textarea
            id="promptText"
            class="prompt-text"
            readonly>
        </textarea>


        <div class="preview-actions">

            <button
                id="copyPromptButton">
                Copy
            </button>

            <button
                id="dropIntoAIButton"
                class="drop-action">
                📥 Drop into AI
            </button>

        </div>

    </section>


    <!-- Footer -->
    <footer>

        <span>LLM Capsule</span>

        <span>v0.3.0</span>

    </footer>

</div>


<script src="popup.js"></script>

</body>
</html>
