<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LLM Capsule</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            🟣
        </div>

        <div>
            <h1>LLM Capsule</h1>

            <p>
                Carry your conversation anywhere.
            </p>
        </div>

    </header>


    <section class="primary-actions">

        <button
            id="capsuleButton"
            class="primary-button">

            ✨ Create Capsule

        </button>

        <button id="libraryButton">

            📦 Capsule Library

        </button>

    </section>


    <section class="secondary-actions">

        <button id="viewButton">
            View Saved
        </button>

        <button id="exportButton">
            Export
        </button>

        <button id="importButton">
            Import
        </button>

        <button id="continueButton">
            Continue
        </button>

    </section>


    <input
        type="file"
        id="importFile"
        accept=".json"
        hidden
    >


    <div
        id="status"
        class="status">
    </div>


    <section
        id="library"
        class="library">

    </section>


    <pre
        id="capsuleOutput"
        class="capsule-output">
    </pre>


    <footer>

        <span>LLM Capsule</span>

        <span>v0.2.0</span>

    </footer>

</div>


<script src="popup.js"></script>

</body>
</html>
